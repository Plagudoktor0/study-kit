name: Build macOS app
on:
  push:
    branches: [macos]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: pyinstaller --windowed --name study-kit --paths src --hidden-import babel.numbers launcher.py
      - run: ditto -c -k --keepParent dist/study-kit.app dist/study-kit-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: study-kit-macos
          path: dist/study-kit-macos.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/study-kit-macos.zip
          draft: true
          generate_release_notes: true
